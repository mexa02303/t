
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Top Supporters</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{font-family:'Fredoka',sans-serif;background:linear-gradient(#bfe9f7,#d9f5e8);color:#1d2b24}
.card{background:white;border:2.5px solid #1d2b24;border-radius:20px;box-shadow:4px 4px 0 #1d2b24}
</style>
</head>
<body class="p-5">
<main class="max-w-2xl mx-auto">
<a href="/" class="underline">← Back to adventure</a>
<h1 class="text-4xl font-bold text-center mt-8">🏆 Top Supporters</h1>
<p class="text-center mt-2 mb-7">A big thank you to everyone supporting this journey!</p>
<div id="leaders" class="space-y-3"></div>
<p id="status" class="text-center text-sm mt-5"></p>
</main>
<script>
const esc=s=>String(s??'Anonymous').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>'₹'+Number(n).toLocaleString('en-IN');
async function load(){
try{
const r=await fetch('/api/supporters');
if(!r.ok)throw Error();
const people=await r.json();
const medals=['🥇','🥈','🥉'];
document.querySelector('#leaders').innerHTML=people.length?people.map((p,i)=>`
<div class="card p-4 flex items-center gap-3">
<div class="text-3xl">${medals[i]||'⭐'}</div>
<div class="flex-1 min-w-0">
<p class="font-bold text-lg break-words">${esc(p.name)}</p>
<p class="text-xs text-gray-500">${p.donations} verified donation(s)</p>
</div>
<strong class="text-green-700">${money(p.total)}</strong>
</div>`).join(''):'<div class="card p-6 text-center">No verified supporters yet. Be the first! ❤️</div>';
document.querySelector('#status').textContent='Updated just now';
}catch(e){
document.querySelector('#status').textContent='Could not load supporters. Please try again.';
}
}
load();
setInterval(load,15000);
</script>
</body>
</html>
s
